<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>uniOPOS - Comanda Móvil</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --primary: #22c55e; --warn: #f97316; --accent: #3b82f6; --danger: #ef4444; }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); padding-bottom: 85px; }
  header { background: var(--card); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #334155; }
  header h1 { font-size: 18px; font-weight: 700; }
  .badge { background: var(--accent); padding: 6px 12px; border-radius: 16px; font-size: 13px; font-weight: 700; cursor: pointer; color: #fff; border: none; outline: none; }
  .btn-back { background: #334155; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  .tabs { display: flex; overflow-x: auto; gap: 8px; padding: 12px 16px; background: #162032; border-bottom: 1px solid #334155; }
  .tab { background: var(--card); color: var(--muted); border: 1px solid #334155; padding: 8px 14px; border-radius: 20px; white-space: nowrap; font-size: 14px; font-weight: 600; cursor: pointer; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .grid-mesas { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 12px; padding: 16px; }
  .mesa { background: var(--card); border-radius: 14px; padding: 18px 10px; text-align: center; border: 2px solid var(--primary); cursor: pointer; }
  .mesa.ocupada { border-color: var(--warn); background: #2a1d18; }
  .mesa-name { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .mesa-status { font-size: 12px; font-weight: 600; color: var(--primary); }
  .mesa.ocupada .mesa-status { color: var(--warn); }
  .search-box { padding: 12px 16px 0; }
  .search-box input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #334155; background: var(--card); color: #fff; font-size: 16px; }
  .prod-list { display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; }
  .prod-card { background: var(--card); padding: 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; cursor: pointer; }
  .prod-info h3 { font-size: 15px; margin-bottom: 4px; }
  .prod-price { color: var(--primary); font-weight: 700; font-size: 15px; }
  .btn-add { background: var(--accent); color: #fff; border: none; width: 38px; height: 38px; border-radius: 10px; font-size: 22px; font-weight: 700; }
  .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #334155; z-index: 20; }
  .btn-primary { background: var(--primary); color: #052e16; border: none; padding: 12px 20px; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: pointer; }
  .btn-primary:disabled { opacity: 0.4; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: flex-end; z-index: 50; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--card); width: 100%; max-height: 88vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 20px; }
  .modal h2 { font-size: 18px; margin-bottom: 6px; }
  .quick-notes { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .chip { background: #334155; color: #fff; border: 1px solid #475569; padding: 9px 13px; border-radius: 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .chip.selected { background: var(--accent); border-color: #60a5fa; }
  .note-input { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid #475569; background: var(--bg); color: #fff; margin-top: 8px; font-size: 15px; }
  .qty-row { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 18px 0; }
  .qty-btn { width: 44px; height: 44px; border-radius: 12px; border: none; background: #334155; color: #fff; font-size: 22px; font-weight: 700; }
  .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #334155; }
  .cart-item.is-aux { padding-left: 16px; border-left: 3px solid var(--accent); background: rgba(59,130,246,0.06); }
  .section-title { font-size: 13px; text-transform: uppercase; color: var(--muted); margin: 14px 0 8px; letter-spacing: 0.5px; }
  .waiter-box { margin-top: 14px; display: flex; align-items: center; justify-content: space-between; background: #0f172a; padding: 10px 12px; border-radius: 10px; border: 1px solid #334155; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:10px;">
    <button id="btnBack" class="btn-back hidden" onclick="showMesas()">← Mesas</button>
    <h1 id="headerTitle">uniOPOS Mesas</h1>
  </div>
  <select id="waiterSelect" class="badge" onchange="handleWaiterSelect(this)">
    <option value="Mesero 1">Mesero 1</option><option value="Mesero 2">Mesero 2</option><option value="Mesero 3">Mesero 3</option>
    <option value="Mesero 4">Mesero 4</option><option value="Mesero 5">Mesero 5</option><option value="Barra / Caja">Barra / Caja</option>
    <option value="__CUSTOM__">+ Escribir nombre...</option>
  </select>
</header>
<div id="viewMesas"><div class="tabs" id="floorTabs"></div><div class="grid-mesas" id="mesasGrid"></div></div>
<div id="viewMenu" class="hidden">
  <div class="search-box"><input type="text" id="searchInput" placeholder="Buscar plato o bebida..." oninput="renderProducts()"></div>
  <div class="tabs" id="catTabs"></div><div class="prod-list" id="prodList"></div>
</div>
<div id="bottomBar" class="bottom-bar hidden">
  <div><div style="font-size:12px;color:var(--muted);">Por enviar (<span id="cartCount">0</span>)</div><div style="font-size:18px;font-weight:800;color:var(--primary);" id="cartTotal">$0</div></div>
  <button class="btn-primary" onclick="openCartModal()">Ver Comanda</button>
</div>
<div class="modal-bg" id="prodModal"><div class="modal">
  <h2 id="mProdName">Producto</h2><div style="color:var(--primary);font-weight:700;margin-bottom:10px;" id="mProdPrice">$0</div>
  <div id="auxSection" class="hidden">
    <div class="section-title">Adiciones / Opciones del Plato (uniCenta)</div>
    <div class="quick-notes" id="auxContainer"></div>
  </div>
  <div class="section-title">Indicación Especial</div>
  <input type="text" id="mNoteInput" class="note-input" placeholder="Otra indicación especial...">
  <div class="qty-row"><button class="qty-btn" onclick="changeModalQty(-1)">-</button><span id="mQty" style="font-size:22px;font-weight:800;">1</span><button class="qty-btn" onclick="changeModalQty(1)">+</button></div>
  <div style="display:flex;gap:10px;"><button class="btn-back" style="flex:1;padding:14px;" onclick="closeModals()">Cancelar</button><button class="btn-primary" style="flex:2;" onclick="confirmAddItem()">Agregar al Pedido</button></div>
</div></div>
<div class="modal-bg" id="cartModal"><div class="modal">
  <h2 id="cMesaTitle">Comanda Mesa</h2><div class="section-title">Nuevo Pedido (Por enviar a cocina)</div><div id="newCartList"></div>
  <div class="waiter-box"><span style="color:var(--muted);font-size:14px;font-weight:600;">Responsable del pedido:</span>
    <select id="orderWaiterSelect" class="badge" onchange="handleWaiterSelect(this)">
      <option value="Mesero 1">Mesero 1</option><option value="Mesero 2">Mesero 2</option><option value="Mesero 3">Mesero 3</option>
      <option value="Mesero 4">Mesero 4</option><option value="Mesero 5">Mesero 5</option><option value="Barra / Caja">Barra / Caja</option>
      <option value="__CUSTOM__">+ Escribir nombre...</option>
    </select>
  </div>
  <div style="display:flex;gap:10px;margin:14px 0;"><button class="btn-back" style="flex:1;padding:14px;" onclick="closeModals()">Seguir pidiendo</button><button class="btn-primary" id="btnSendOrder" style="flex:2;" onclick="sendOrder()">Enviar a Cocina / Caja</button></div>
  <div class="section-title">Pedido Actual en Mesa (uniCenta)</div><div id="existingLinesList" style="font-size:14px;color:var(--muted);"></div><div id="existingTotal" style="margin-top:8px;font-weight:800;color:var(--warn);"></div>
</div></div>
<script>
let floors = [], places = [], categories = [], products = [], auxiliariesMap = {}, selectedFloor = 'ALL', selectedCat = 'ALL', currentMesa = null, modalProd = null, modalQty = 1, selectedAuxIds = new Set(), cart = [];
let waiterName = localStorage.getItem('waiterName') || 'Mesero 1';

function syncWaiterSelects(name) {
  ['waiterSelect', 'orderWaiterSelect'].forEach(id => {
    const sel = document.getElementById(id);
    if (!sel) return;
    if (![...sel.options].some(o => o.value === name)) { sel.add(new Option(name, name), sel.options.length - 1); }
    sel.value = name;
  });
}

function handleWaiterSelect(sel) {
  if (sel.value === '__CUSTOM__') {
    const n = prompt('Escribe el nombre del mesero:', waiterName);
    if (n && n.trim()) { waiterName = n.trim(); localStorage.setItem('waiterName', waiterName); }
  } else {
    waiterName = sel.value; localStorage.setItem('waiterName', waiterName);
  }
  syncWaiterSelects(waiterName);
}
syncWaiterSelects(waiterName);

const fmt = (n) => '$' + Math.round(n).toLocaleString('es-CO');

async function init() {
  const [mRes, cRes] = await Promise.all([fetch('/api/mesas').then(r => r.json()), fetch('/api/menu').then(r => r.json())]);
  if (mRes.ok) { floors = mRes.floors; places = mRes.places; renderFloors(); renderMesas(); }
  if (cRes.ok) { categories = cRes.categories; products = cRes.products; auxiliariesMap = cRes.auxiliaries || {}; renderCats(); renderProducts(); }
}

function renderFloors() {
  let html = `<button class="tab ${selectedFloor === 'ALL' ? 'active' : ''}" onclick="setFloor('ALL')">Todas</button>`;
  floors.forEach(f => { html += `<button class="tab ${selectedFloor === f.ID ? 'active' : ''}" onclick="setFloor('${f.ID}')">${f.NAME}</button>`; });
  document.getElementById('floorTabs').innerHTML = html;
}
function setFloor(id) { selectedFloor = id; renderFloors(); renderMesas(); }

function renderMesas() {
  const list = selectedFloor === 'ALL' ? places : places.filter(p => p.FLOOR === selectedFloor);
  document.getElementById('mesasGrid').innerHTML = list.map(m => `<div class="mesa ${m.ocupada ? 'ocupada' : ''}" onclick="openMesa('${m.ID}', '${m.NAME}')"><div class="mesa-name">${m.NAME}</div><div class="mesa-status">${m.ocupada ? '● Ocupada' : '● Libre'}</div></div>`).join('');
}

async function showMesas() {
  currentMesa = null; cart = []; updateBottomBar();
  document.getElementById('viewMesas').classList.remove('hidden'); document.getElementById('viewMenu').classList.add('hidden');
  document.getElementById('btnBack').classList.add('hidden'); document.getElementById('headerTitle').innerText = 'uniOPOS Mesas';
  const mRes = await fetch('/api/mesas').then(r => r.json());
  if (mRes.ok) { places = mRes.places; renderMesas(); }
}

function openMesa(id, name) {
  currentMesa = { id, name }; cart = []; updateBottomBar();
  document.getElementById('viewMesas').classList.add('hidden'); document.getElementById('viewMenu').classList.remove('hidden');
  document.getElementById('btnBack').classList.remove('hidden'); document.getElementById('headerTitle').innerText = name;
  document.getElementById('searchInput').value = ''; renderProducts();
}

function renderCats() {
  let html = `<button class="tab ${selectedCat === 'ALL' ? 'active' : ''}" onclick="setCat('ALL')">Todo</button>`;
  categories.forEach(c => { const label = c.NAME === 'Category Standard' ? 'Categoría Estándar' : c.NAME; html += `<button class="tab ${selectedCat === c.ID ? 'active' : ''}" onclick="setCat('${c.ID}')">${label}</button>`; });
  document.getElementById('catTabs').innerHTML = html;
}
function setCat(id) { selectedCat = id; renderCats(); renderProducts(); }

function renderProducts() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const list = products.filter(p => (selectedCat === 'ALL' || p.CATEGORY === selectedCat) && p.NAME.toLowerCase().includes(q));
  document.getElementById('prodList').innerHTML = list.map(p => `<div class="prod-card" onclick="openProdModal('${p.ID}')"><div class="prod-info"><h3>${p.NAME}</h3><div class="prod-price">${fmt(p.PRICESELL * (1 + (p.TAX_RATE || 0)))}</div></div><button class="btn-add">+</button></div>`).join('');
}

function openProdModal(id) {
  modalProd = products.find(p => p.ID === id); modalQty = 1; selectedAuxIds.clear();
  document.getElementById('mProdName').innerText = modalProd.NAME;
  document.getElementById('mProdPrice').innerText = fmt(modalProd.PRICESELL * (1 + (modalProd.TAX_RATE || 0)));
  document.getElementById('mQty').innerText = '1'; document.getElementById('mNoteInput').value = '';
  const auxList = auxiliariesMap[id] || [];
  const auxSec = document.getElementById('auxSection');
  if (auxList.length > 0) {
    auxSec.classList.remove('hidden');
    document.getElementById('auxContainer').innerHTML = auxList.map(a => {
      const pFinal = a.PRICESELL * (1 + (a.TAX_RATE || 0));
      const pTag = pFinal > 0 ? ` (+${fmt(pFinal)})` : '';
      return `<button class="chip" data-aux-id="${a.ID}" onclick="toggleAux(this, '${a.ID}')">${a.NAME}${pTag}</button>`;
    }).join('');
  } else {
    auxSec.classList.add('hidden');
    document.getElementById('auxContainer').innerHTML = '';
  }
  document.getElementById('prodModal').classList.add('open');
}

function toggleAux(el, auxId) {
  if (selectedAuxIds.has(auxId)) { selectedAuxIds.delete(auxId); el.classList.remove('selected'); }
  else { selectedAuxIds.add(auxId); el.classList.add('selected'); }
}
function changeModalQty(d) { modalQty = Math.max(1, modalQty + d); document.getElementById('mQty').innerText = modalQty; }

function confirmAddItem() {
  const extra = document.getElementById('mNoteInput').value.trim();
  const cat = categories.find(c => c.ID === modalProd.CATEGORY);
  const catName = cat ? cat.NAME : '';
  cart.push({ id: modalProd.ID, name: modalProd.NAME, qty: modalQty, price: modalProd.PRICESELL, taxId: modalProd.TAX_ID, taxName: modalProd.TAX_NAME, taxCat: modalProd.TAX_CAT, taxRate: modalProd.TAX_RATE || 0, taxOrder: modalProd.TAX_ORDER || 1, catName, notes: extra, isCom: false });
  const auxList = auxiliariesMap[modalProd.ID] || [];
  selectedAuxIds.forEach(auxId => {
    const aux = auxList.find(a => a.ID === auxId);
    if (aux) {
      cart.push({ id: aux.ID, name: aux.NAME, qty: modalQty, price: aux.PRICESELL, taxId: aux.TAX_ID, taxName: aux.TAX_NAME, taxCat: aux.TAX_CAT, taxRate: aux.TAX_RATE || 0, taxOrder: aux.TAX_ORDER || 1, catName, notes: '', isCom: true });
    }
  });
  closeModals(); updateBottomBar();
}

function updateBottomBar() {
  const count = cart.filter(i => !i.isCom).reduce((s, i) => s + i.qty, 0);
  const total = cart.reduce((s, i) => s + (i.price * (1 + i.taxRate) * i.qty), 0);
  document.getElementById('cartCount').innerText = count; document.getElementById('cartTotal').innerText = fmt(total);
  document.getElementById('bottomBar').classList.toggle('hidden', cart.length === 0);
}

async function openCartModal() {
  document.getElementById('cMesaTitle').innerText = 'Comanda - ' + currentMesa.name;
  syncWaiterSelects(waiterName); renderCartList(); document.getElementById('cartModal').classList.add('open');
  document.getElementById('existingLinesList').innerHTML = 'Cargando...'; document.getElementById('existingTotal').innerText = '';
  const res = await fetch('/api/mesa/' + currentMesa.id).then(r => r.json());
  if (res.ok && res.lines.length > 0) {
    document.getElementById('existingLinesList').innerHTML = res.lines.map(l => `<div>• ${l.qty}x ${l.name} (${fmt(l.total)})</div>`).join('');
    document.getElementById('existingTotal').innerText = 'Total acumulado: ' + fmt(res.total);
  } else { document.getElementById('existingLinesList').innerText = 'Mesa sin pedidos previos.'; }
}

function renderCartList() {
  document.getElementById('newCartList').innerHTML = cart.map((item, idx) => `<div class="cart-item ${item.isCom ? 'is-aux' : ''}"><div><strong>${item.isCom ? '↳ ' : ''}${item.qty}x ${item.name}</strong>${item.notes ? `<div style="font-size:12px;color:var(--warn);">${item.notes}</div>` : ''}</div><div style="display:flex;align-items:center;gap:10px;"><span style="color:var(--primary);font-weight:700;">${fmt(item.price * (1 + item.taxRate) * item.qty)}</span><button onclick="removeCartItem(${idx})" style="background:var(--danger);color:#fff;border:none;width:28px;height:28px;border-radius:6px;font-weight:bold;">X</button></div></div>`).join('');
  document.getElementById('btnSendOrder').disabled = cart.length === 0;
}
function removeCartItem(idx) { cart.splice(idx, 1); renderCartList(); updateBottomBar(); }
function closeModals() { document.querySelectorAll('.modal-bg').forEach(m => m.classList.remove('open')); }

let isSending = false;
async function sendOrder() {
  if (isSending) return; isSending = true;
  const btn = document.getElementById('btnSendOrder'); btn.disabled = true; btn.innerText = 'Enviando...';
  try {
    const res = await fetch('/api/pedido', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ placeId: currentMesa.id, placeName: currentMesa.name, waiterName: waiterName, items: cart }) }).then(r => r.json());
    if (res.ok) { cart = []; updateBottomBar(); closeModals(); showMesas(); } else { alert('Error: ' + res.error); }
  } catch (e) { alert('Error de conexión con el servidor'); }
  finally { isSending = false; btn.disabled = false; btn.innerText = 'Enviar a Cocina / Caja'; }
}
init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Monitor de Comandas - Cocina y Bar</title>
<style>
  body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; padding: 20px; }
  h1 { border-bottom: 2px solid #334155; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .ticket { background: #1e293b; border-radius: 12px; padding: 16px; border-left: 6px solid #22c55e; }
  .ticket.bar { border-left-color: #3b82f6; }
  .t-head { display: flex; justify-content: space-between; font-weight: 800; font-size: 18px; border-bottom: 1px solid #334155; padding-bottom: 8px; margin-bottom: 10px; }
  .t-meta { font-size: 12px; color: #94a3b8; margin-bottom: 10px; }
  .t-item { font-size: 16px; padding: 4px 0; font-weight: 600; }
  .t-note { color: #f97316; font-size: 13px; margin-left: 18px; }
  .btn-done { width: 100%; margin-top: 12px; padding: 10px; background: #334155; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<h1><span>Monitor de Comandas (Cocina / Bar)</span><span id="clock" style="color:#22c55e;"></span></h1>
<div class="grid" id="ticketsGrid"></div>
<script>
let lastCount = 0;
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.25);
  } catch(e){}
}
async function loadComandas() {
  document.getElementById('clock').innerText = new Date().toLocaleTimeString();
  const res = await fetch('/api/comandas').then(r=>r.json());
  if (!res.ok) return;
  if (res.comandas.length > lastCount) beep();
  lastCount = res.comandas.length;
  document.getElementById('ticketsGrid').innerHTML = res.comandas.map(c => `
    <div class="ticket ${c.area === 'BAR' ? 'bar' : ''}">
      <div class="t-head"><span>${c.area} - ${c.mesa}</span><span>#${c.id}</span></div>
      <div class="t-meta">Mesero: ${c.mesero} | Hora: ${c.hora}</div>
      ${c.items.map(i => `<div class="t-item">${i.qty}x ${i.name}</div>${i.notes ? `<div class="t-note">>> ${i.notes}</div>` : ''}`).join('')}
      <button class="btn-done" onclick="despachar(${c.id})">Marcar Despachado</button>
    </div>
  `).join('');
}
async function despachar(id) { await fetch('/api/comandas/' + id, { method: 'DELETE' }); loadComandas(); }
setInterval(loadComandas, 2500);
loadComandas();
</script>
</body>
</html>
